title: Scheduled Task (T1053.005) — custom detection
id: t1053-005-backtranslated-c5038891
status: experimental
description: |
  Custom detection for T1053.005 Scheduled Task, deployed and measured in an MSc detection-engineering
  study on Wazuh 4.14.6. Covers 2 deployed rule(s): 100270, 100271.

  100270 fires 15 attack / 4 benign. Creating a scheduled task looks the same whoever does it,
  because it is the same action.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: Abdul Basit Mohammed (c5038891), Sheffield Hallam University
date: 2026-08-12
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
  definition: |
    Sysmon EID 1. In Wazuh these rules chain from sysmon_eid1_detections via if_group/if_sid,
    which has no Sigma equivalent — Sigma matches events directly rather than other rules.
    ⚠️ Rules chaining from `sysmon_eid1_detections` only see events a VENDOR rule already
    matched, so they inherit its blind spots. That constraint disappears in Sigma.
detection:
  wazuh_100270:   # Wazuh rule 100270, level 10 — T1053.005 Scheduled Task created or modified via schtasks
    OriginalFileName|re: '(?i)^schtasks\.exe$'
    CommandLine|re: '(?i)\s/(create|change)\b'

  wazuh_100271:   # Wazuh rule 100271, level 10 — T1053.005 Scheduled Task created or modified via PowerShell or WMI
    OriginalFileName|re: '(?i)^powershell(\.exe)?$'
    CommandLine|re: '(?i)(Register-ScheduledTask|Set-ScheduledTask|New-ScheduledTask|MSFT_ScheduledTask)'

  condition: wazuh_100270 or wazuh_100271
falsepositives:
  - See MEASURED CAVEAT in the description — these counts were observed, not estimated.
  - Routine administration. Measured in this lab as a both-classes signal for most rules,
    so this is a triage input rather than a standalone verdict.
level: high
---
