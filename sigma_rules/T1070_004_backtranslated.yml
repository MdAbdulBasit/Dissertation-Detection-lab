#   100311  L10  sysmon_eid1_detections     T1070.004 Deletion of forensic artefact: $(win.eventdata.commandLine)
#   100312  L8   sysmon_event_26            T1070.004 File deleted from disk by $(win.eventdata.image): $(win.eventdata.ta
#   100313  L10  sysmon_event_26            T1070.004 Forensic artefact deleted from disk: $(win.eventdata.targetFilename)
