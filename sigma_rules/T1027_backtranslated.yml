title: T1027 (T1027) — custom detection
id: t1027-backtranslated-c5038891
status: experimental
description: |
  Custom detection for T1027 T1027, deployed and measured in an MSc detection-engineering
  study on Wazuh 4.14.6. Covers 1 deployed rule(s): 100263.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1027/T1027.md
author: Abdul Basit Mohammed (c5038891), Sheffield Hallam University
date: 2026-08-12
tags:
  - attack.execution
  - attack.t1027
