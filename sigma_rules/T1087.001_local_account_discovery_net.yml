title: Local Account Discovery via net.exe
id: 8f3c1e6a-2b74-4d19-9a5f-6c0d7e1b4a52
status: experimental
description: >
  Detects local account and group enumeration performed with the built-in net.exe / net1.exe utility.
  Written for the MSc dissertation lab as a detection-as-code artefact; translated to a Wazuh local
  rule (ID 100200) for deployment. Default Wazuh rule 92031 detects this activity only at the parent
  technique level (T1087); this rule adds sub-technique precision (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1087.001/T1087.001.md
author: Abdul Basit Mohammed (c5038891), Sheffield Hallam University
date: 2026/08/05
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_binary:
    OriginalFileName:
      - 'net.exe'
      - 'net1.exe'
  selection_enumeration:
    CommandLine|contains:
      - ' user'
      - ' localgroup'
      - ' group'
      - ' accounts'
  condition: selection_binary and selection_enumeration
fields:
  - Image
  - OriginalFileName
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Legitimate administrative account and group auditing
  - Logon scripts and inventory tooling that enumerate group membership
  - Helpdesk troubleshooting of account or group membership issues
level: medium

# ---------------------------------------------------------------------------
# DEPLOYMENT NOTE
#
# The Wazuh rule currently deployed as ID 100200 matches on OriginalFileName ONLY and does not
# include selection_enumeration. It therefore fires on every net.exe invocation (net use, net start,
# net view, net share) and maps all of them to T1087.001.
#
# This Sigma rule is the corrected specification. See RULE_ID_REGISTER.md note 1 for the decision
# on whether to tighten the deployed Wazuh rule to match, and the cost of doing so.
#
# Wazuh translation of the corrected form:
#
#   <group name="attack,discovery,local,">
#     <rule id="100200" level="10">
#       <if_group>sysmon_eid1_detections</if_group>
#       <field name="win.eventdata.originalFileName" type="pcre2">(?i)net1?\.exe</field>
#       <field name="win.eventdata.commandLine" type="pcre2">(?i)\s+(user|localgroup|group|accounts)\b</field>
#       <description>T1087.001 Local Account Discovery via net.exe</description>
#       <mitre><id>T1087.001</id></mitre>
#     </rule>
#   </group>
#
# Chain from sysmon_eid1_detections (the group Sysmon EID 1 events land in AFTER matching a built-in
# detection rule) — NOT sysmon_event1. Verify against the `groups` field of a real event in Discover.
# ---------------------------------------------------------------------------
